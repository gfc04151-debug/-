<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font: 15px system-ui, sans-serif; min-width: 260px; margin: 0; padding: 14px; background: #181818; color: #f1f1f1; }
    h1 { font-size: 16px; margin: 0 0 12px; }
    label { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 10px 0; }
    input[type=range] { width: 100%; accent-color: #ff0033; }
    select { font: inherit; background: #333; color: #fff; border: 0; border-radius: 6px; padding: 6px; }
    input[type=radio] { width: 20px; height: 20px; accent-color: #ff0033; flex: none; }
    input[type=checkbox] { width: 20px; height: 20px; accent-color: #ff0033; }
    button { font: inherit; border: 0; border-radius: 8px; padding: 10px; background: #333; color: #fff; width: 100%; margin-top: 8px; }
    button.main { background: #ff0033; }
    .slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .slots button { margin: 0; }
    .hint { color: #aaa; font-size: 12px; margin-top: 10px; }
    .hidden { display: none; }
    .disabled { opacity: .4; pointer-events: none; }
    hr { border: 0; border-top: 1px solid #333; margin: 14px 0; }
  </style>
</head>
<body>
  <h1>▶▶ YouTube Dual Play</h1>
  <button class="main" id="openMulti">Открыть мультиэкран (4 видео)</button>
  <div id="addBox" class="hidden">
    <div class="hint">Добавить это видео в окно мультиэкрана:</div>
    <div class="slots">
      <button data-slot="0">1</button><button data-slot="1">2</button>
      <button data-slot="2">3</button><button data-slot="3">4</button>
    </div>
  </div>
  <hr>
  <label>Скрывать Shorts (поиск, главная, рекомендации) <input type="checkbox" id="hideShorts"></label>
  <label>Скрывать видео короче
    <select id="minMinutes">
      <option value="0">не скрывать</option><option value="1">1 мин</option><option value="2">2 мин</option>
      <option value="3">3 мин</option><option value="5">5 мин</option><option value="10">10 мин</option>
    </select></label>
  <label>Скрывать видео старше
    <select id="maxAgeDays">
      <option value="0">не скрывать</option><option value="7">1 недели</option>
      <option value="30">1 месяца</option><option value="90">3 месяцев</option><option value="365">1 года</option>
    </select></label>
  <label>Не ставить на паузу в фоне <input type="checkbox" id="enabled"></label>
  <div class="hint">Звук в обычных вкладках YouTube (мультиэкран всегда без звука):</div>
  <label class="radio"><span>Обычный звук</span><input type="radio" name="mode" value="normal"></label>
  <label class="radio"><span>Без звука</span><input type="radio" name="mode" value="silent"></label>
  <label class="radio"><span>Звук во всех вкладках сразу (опыт)</span><input type="radio" name="mode" value="mix"></label>
  <label>Скорость в мультиэкране
    <select id="speed">
      <option value="0.25">0,25</option><option value="0.5">0,5</option><option value="0.75">0,75</option>
      <option value="1">1 (обычная)</option><option value="1.5">1,5</option><option value="2">2</option>
      <option value="0">не менять</option>
    </select></label>
  <label>Качество в мультиэкране
    <select id="quality">
      <option value="tiny">144p</option><option value="small">240p</option><option value="medium">360p</option>
      <option value="large">480p</option><option value="hd720">720p</option><option value="">авто</option>
    </select></label>
  <div id="volBox">
    <label>Громкость этой вкладки <span id="volText">—</span></label>
    <input type="range" id="volume" min="0" max="100" step="1">
  </div>
  <div class="hint" id="history"></div>
  <div class="hint" id="status">После установки обновите вкладки YouTube.</div>
  <script src="popup.js"></script>
</body>
</html>
